<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SPINS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="logo">SPINS</div>
  <div>💰 <span id="balance" class="balance">0</span></div>
</div>

<div class="players-strip" id="playersStrip"></div>

<!-- ЛОББИ -->
<div id="screen-main" class="center">
  <div class="bank-title">Банк раунда</div>
  <div id="bank" class="bank">0</div>

  <br>
  <input id="betAmount" placeholder="Ставка">
  <br><br>
  <button id="betBtn">Сделать ставку</button>
  <br>
  <button id="startBtn">Запустить раунд</button>
</div>

<!-- КОЛЕСО -->
<div id="screen-wheel" class="center hidden">
  <div id="wheel"></div>
  <div id="timer"></div>
</div>

<!-- ПОБЕДА -->
<div id="screen-win" class="center hidden">
  <h2>🎉 Победа!</h2>
  <div id="winAmount"></div>
  <br>
  <button id="backBtnWin">Вернуться в лобби</button>
</div>

<!-- ПРОИГРЫШ -->
<div id="screen-lose" class="center hidden">
  <h2>😢 Проигрыш</h2>
  <br>
  <button id="backBtnLose">Вернуться в лобби</button>
</div>

<div class="footer">SPINS</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="app.js"></script>
</body>

</html>
