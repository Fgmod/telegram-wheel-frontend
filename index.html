<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SPINS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <div class="logo">SPINS</div>
  <div>💰 <span id="balance" class="balance">0</span></div>
</div>

<div class="players-strip" id="playersStrip"></div>

<div id="screen-main" class="center">
  <div>🏦 Банк раунда</div>
  <div id="bank" class="bank">0</div>
  <br>
  <input id="betAmount" placeholder="Ставка">
  <br><br>
  <button id="betBtn">Сделать ставку</button>
  <br><br>
  <button id="startBtn">Запустить</button>
</div>

<div id="screen-wheel" class="center hidden">
  <div id="wheel"></div>
  <div id="timer"></div>
</div>

<div id="screen-win" class="center hidden">
  <h2>🎉 Победа</h2>
  <div id="winAmount"></div>
</div>

<div id="screen-lose" class="center hidden">
  <h2>😢 Проигрыш</h2>
</div>

<div class="footer">SPINS</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="app.js"></script>
</body>

</html>
