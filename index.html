<body>
<div id="app">

<div class="topbar">
  💰 Баланс: <span id="balance" class="balance">0</span> |
  🏦 Банк: <span id="bank" class="bank">0</span>
</div>

<div id="screen-main" class="screen">
  <h2>🎰 Wheel Game</h2>
  <input id="betAmount" placeholder="Ставка">
  <button id="betBtn">Сделать ставку</button>
  <br><br>
  <button id="startBtn">Запустить раунд</button>
  <h3>Игроки</h3>
  <div id="players"></div>
</div>

<div id="screen-wheel" class="screen hidden">
  <h3>Крутится колесо...</h3>
  <div id="wheel"></div>
  <div id="timer"></div>
</div>

<div id="screen-win" class="screen hidden">
  <h2>🎉 Победа!</h2>
  <div id="winAmount"></div>
  <button onclick="location.reload()">Ок</button>
</div>

<div id="screen-lose" class="screen hidden">
  <h2>😢 Проигрыш</h2>
  <button onclick="location.reload()">Ок</button>
</div>

</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="app.js"></script>
</body>
