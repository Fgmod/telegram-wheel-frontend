<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wheel Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <div id="screen-main" class="screen">
    <h2>🎮 Wheel Game</h2>
    <button id="joinBtn">Участвовать</button>
  </div>

  <div id="screen-lobby" class="screen hidden">
    <h3>Лобби</h3>
    <div id="players"></div>
    <button id="startBtn">Запустить раунд</button>
  </div>

  <div id="screen-wheel" class="screen hidden">
    <h3>Колесо фортуны</h3>
    <div id="wheel"></div>
    <div id="timer"></div>
  </div>

  <div id="screen-win" class="screen hidden">
    <h2>🎉 Вы победили!</h2>
    <button onclick="location.reload()">Выйти</button>
  </div>

  <div id="screen-lose" class="screen hidden">
    <h2>😢 Вы проиграли</h2>
    <button onclick="location.reload()">Выйти</button>
  </div>

</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="app.js"></script>
</body>
</html>
